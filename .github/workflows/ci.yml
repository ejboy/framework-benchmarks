name: Correctness CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Temurin 25.0.4.1 and Maven 3.9.9
        run: |
          url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1
          archive=OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz
          curl -fLsS --retry 2 "$url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fLsS "$url/$archive.sha256.txt" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          java_home="$RUNNER_TEMP/jdk-25.0.4.1+1"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

          archive="apache-maven-3.9.9-bin.tar.gz"
          central="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9"
          apache="https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries"
          curl -fLsS --retry 2 "$central/$archive" -o "$RUNNER_TEMP/$archive" ||
            curl -fLsS --retry 2 "$apache/$archive" -o "$RUNNER_TEMP/$archive"
          checksum=a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Build and test applications
        run: |
          mvn -B -f market-replay-portfolio/app/pom.xml clean package
          mvn -B -f framework-benchmarks/quarkus-coilbase/pom.xml clean package
          mvn -B -f framework-benchmarks/jex-coilbase/pom.xml clean package
          mvn -B -f framework-benchmarks/micronaut-data-jdbc/pom.xml clean package
      - name: Verify Linux distributions
        run: |
          spring=market-replay-portfolio/app/target/market-replay-portfolio-0.1.0-SNAPSHOT.jar
          java -Djarmode=tools -jar "$spring" extract --destination "$RUNNER_TEMP/spring-layout"
          python3 - "$RUNNER_TEMP/spring-layout" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          spring = Path(sys.argv[1])
          quarkus = Path("framework-benchmarks/quarkus-coilbase/target/quarkus-app")
          jex = Path("framework-benchmarks/jex-coilbase/target")
          micronaut = Path("framework-benchmarks/micronaut-data-jdbc/target/distribution")
          distributions = (
              (spring / "market-replay-portfolio-0.1.0-SNAPSHOT.jar", spring / "lib",
               ("spring-boot-", "spring-jdbc-", "tomcat-embed-core-", "HikariCP-", "postgresql-")),
              (quarkus / "quarkus-run.jar", quarkus / "lib/main",
               ("io.quarkus.quarkus-rest-", "xyz.pvrlabs.coilbase-core-", "org.jdbi.jdbi3-core-",
                "io.agroal.agroal-pool-", "org.postgresql.postgresql-", "com.aayushatharva.brotli4j.native-linux-x86_64-")),
              (jex / "portfolio-jex-coilbase.jar", jex / "lib",
               ("avaje-jex-", "coilbase-core-", "coilbase-jex-", "jdbi3-core-", "HikariCP-", "postgresql-")),
              (micronaut / "portfolio-micronaut-data-jdbc.jar", micronaut / "lib",
               ("micronaut-http-server-netty-", "micronaut-data-jdbc-", "micronaut-jdbc-hikari-",
                "HikariCP-", "postgresql-")),
          )
          for launcher, libraries, required in distributions:
              assert launcher.is_file(), f"Missing launcher: {launcher}"
              for dependency in required:
                  assert list(libraries.glob(f"{dependency}*.jar")), f"Missing {dependency} in {libraries}"

          for root in (spring, quarkus, jex / "lib", micronaut):
              assert not list(root.rglob("._*")), f"AppleDouble files in {root}"

          jars = [launcher for launcher, _, _ in distributions]
          for root in (spring, quarkus, jex / "lib", micronaut):
              jars.extend(root.rglob("*.jar"))
          for jar in set(jars):
              with ZipFile(jar) as archive:
                  assert all(not any(part.startswith("._") for part in name.split("/"))
                             for name in archive.namelist()), f"AppleDouble entries in {jar}"

          assert list((quarkus / "app").glob("portfolio-quarkus-coilbase-*.jar"))
          assert not list(quarkus.rglob("*native-osx*.jar"))
          print("Verified Spring Boot, Quarkus, Jex, and Micronaut Linux distributions")
          PY
      - name: Prepare PostgreSQL for correctness checks
        run: |
          if command -v pg_lsclusters >/dev/null; then
            pg_lsclusters --no-header | while read -r version cluster port status rest; do
              if [[ "$status" == online* ]]; then
                sudo pg_ctlcluster "$version" "$cluster" stop
              fi
            done
          fi
          sudo bash framework-benchmarks/scripts/postgres-setup.sh
          # Package installation can skip automatic cluster creation.
          if [[ -f /etc/postgresql/18/main/postgresql.conf ]]; then
            sudo pg_conftool 18 main set port 5432
          else
            sudo pg_createcluster --port 5432 18 main
          fi
          sudo bash framework-benchmarks/scripts/prepare-postgres.sh
      - name: Verify Spring Boot against PostgreSQL
        run: |
          python3 framework-benchmarks/scripts/verify-postgres.py --local \
            --output "$RUNNER_TEMP/spring-correctness"
      - name: Verify Quarkus against PostgreSQL
        run: |
          python3 framework-benchmarks/scripts/verify-postgres.py --local --quarkus \
            --output "$RUNNER_TEMP/quarkus-correctness"
      - name: Verify Jex against PostgreSQL
        run: |
          python3 framework-benchmarks/scripts/verify-postgres.py --local --jex \
            --output "$RUNNER_TEMP/jex-correctness"
      - name: Verify Micronaut against PostgreSQL
        run: |
          python3 framework-benchmarks/scripts/verify-postgres.py --local --micronaut \
            --output "$RUNNER_TEMP/micronaut-correctness"
      - name: Check frozen upstream v1 JVM defaults
        if: github.repository == 'PVRLabs/framework-benchmarks' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PYTHONPATH: framework-benchmarks/scripts
        run: |
          python3 - <<'PY'
          import benchmark_config

          if benchmark_config.load() != benchmark_config.STANDARD:
              raise SystemExit('Upstream config-v1.json must match the frozen v1 JVM settings')
          PY
      - name: Test Python fixture, workload, and harness
        run: |
          python3 -m unittest discover -s market-replay-portfolio/fixture/tests
          python3 -m unittest discover -s market-replay-portfolio/workload
          python3 -m unittest discover -s framework-benchmarks/tests
      - name: Verify offline report regeneration
        run: |
          evidence=framework-benchmarks/evidence/v1-accepted
          cp -a "$evidence" "$RUNNER_TEMP/v1-report"
          rm "$RUNNER_TEMP/v1-report/report.html"
          python3 framework-benchmarks/scripts/colocated-suite.py report "$RUNNER_TEMP/v1-report/suite.json"
          cmp "$evidence/report.html" "$RUNNER_TEMP/v1-report/report.html"
          cmp "$evidence/featured.svg" "$RUNNER_TEMP/v1-report/featured.svg"
      - name: Upload regenerated archived v1 report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archived-v1-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1-report
          if-no-files-found: error
